<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>E-VIAS</title>
    <script>
      // Apply theme + direction before first paint (no flash). Same keys as src/store/ui.ts.
      try {
        var t = localStorage.getItem("evias.theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var l = localStorage.getItem("evias.lang") || "ar";
        document.documentElement.dataset.theme = t;
        document.documentElement.lang = l;
        document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
