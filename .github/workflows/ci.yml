name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    name: Build + smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (generates data, checks every planted story, typechecks, bundles bridge tools)
        run: npm run build
      - run: npm run check:i18n
      - run: npm test
      - name: Bridge smoke test with a fake CLI
        run: node scripts/smoke-bridge.mjs

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
        env:
          SHOT_DIR: ci-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ci-screenshots
